<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş | Aqua Touch Yönetim</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <img class="logo" src="../assets/img/logo.png" alt="Aqua Touch">
    <h1>Yönetim Paneli</h1>
    <p>Devam etmek için giriş yapın</p>
    <div class="field">
      <label for="u">Kullanıcı Adı</label>
      <input class="input" id="u" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">Şifre</label>
      <input class="input" id="p" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn--ink" style="width:100%; justify-content:center; padding:12px;" type="submit">Giriş Yap</button>
  </form>
</div>
<script src="admin.js" defer></script>
</body>
</html>
